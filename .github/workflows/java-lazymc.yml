name: Build Java lazymc

on:
  push:
    branches: [main]
    paths:
      - 'java/lazymc/8/**'
      - 'java/lazymc/11/**'
      - 'java/lazymc/21/**'
      - 'java/lazymc/25/**'
  pull_request:
    branches: [main]
    paths:
      - 'java/lazymc/8/**'
      - 'java/lazymc/11/**'
      - 'java/lazymc/21/**'
      - 'java/lazymc/25/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Java ${{ matrix.java_version }}-lazymc
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        java_version: [8, 11, 21, 25]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/efinaserver/shells/java
          tags: |
            type=raw,value=${{ matrix.java_version }}-lazymc

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: java/lazymc/${{ matrix.java_version }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=java-lazymc-${{ matrix.java_version }}
          cache-to: type=gha,mode=max,scope=java-lazymc-${{ matrix.java_version }}
